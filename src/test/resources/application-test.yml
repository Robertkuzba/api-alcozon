# Profil testowy — integracje MockMvc + Testcontainers
spring:
  docker:
    compose:
      skip-in-tests: true
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 60000
      max-lifetime: 120000
  test:
    context:
      cache:
        max-size: 8

# Stały sekret w testach (nie zależy od pustego JWT_SECRET w OS)
jwt:
  secret: test-jwt-secret-key-min-256-bits-for-hs256-integration-tests-only
  access-ttl: 900
  refresh-ttl: 2592000

app:
  rate-limit:
    enabled: false
  two-factor:
    enabled: false
  mail:
    log-only: true
  dev:
    notification-test-hook:
      enabled: true
