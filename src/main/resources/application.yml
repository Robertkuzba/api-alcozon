spring:
  application:
    name: alcohol-factory-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alcohol_db}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

logging:
  level:
    root: INFO
    com.alcoholfactory: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO

# JWT (dev – w produkcji użyj zmiennych środowiskowych)
jwt:
  secret: ${JWT_SECRET:dev-secret-key-min-256-bits-for-hs256-please-change-in-production}
  access-ttl: 900
  # Refresh token: 30 dni (wymóg mobilki / „zaufane urządzenie” na demo)
  refresh-ttl: 2592000

app:
  mail:
    from: ${MAIL_FROM:noreply@alkozon.local}
    log-only: ${MAIL_LOG_ONLY:false}
  two-factor:
    enabled: ${APP_TWO_FACTOR_ENABLED:true}
    code-ttl-seconds: ${APP_TWO_FACTOR_CODE_TTL:600}
    challenge-ttl-seconds: ${APP_TWO_FACTOR_CHALLENGE_TTL:900}
    fixed-code-for-tests: ${APP_TWO_FACTOR_FIXED_CODE:}
  openapi:
    # Swagger UI: dodatkowy serwer (nadpisz APP_OPENAPI_SERVER_URL jeśli inny host niż domyślny Render)
    server-url: ${APP_OPENAPI_SERVER_URL:https://api-alcozon.onrender.com}
  firebase:
    # Opcjonalnie: wklej JSON service account z Firebase (Render: Secret / env).
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  dev:
    notification-test-hook:
      # Tymczasowo true na Renderze tylko do testów FCM (mobilka); potem wyłącz.
      enabled: ${APP_DEV_NOTIFICATION_TEST_HOOK_ENABLED:false}
  cors:
    # Dodatkowe originy produkcyjne (np. desktop): zmienna APP_CORS_ALLOWED_ORIGINS=url1,url2
    # Dev whitelist:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5000
      - http://127.0.0.1:5000
      - http://localhost:8081
      - http://127.0.0.1:8081
      - http://10.0.2.2:3000
      - http://10.0.2.2:5000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - Origin
      - X-Requested-With
      - X-Client-Id
    exposed-headers:
      - Authorization
      - Location
    allow-credentials: true
    max-age-seconds: 3600

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    operationsSorter: method

# Serwer — na Renderze ustaw PORT w env; lokalnie domyślnie 8080
server:
  port: ${PORT:8080}

# Actuator — publiczny health dla Render / monitoringu (bez auth)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Na Renderze nie ma Mailpit (localhost:1025) — bez tego health = DOWN i deploy się wywala
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
