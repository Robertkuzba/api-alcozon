spring:
  application:
    name: alcohol-factory-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alcohol_db}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  docker:
    compose:
      skip-in-tests: true

logging:
  level:
    root: INFO
    com.alcoholfactory: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO

# JWT (dev – w produkcji użyj zmiennych środowiskowych)
jwt:
  secret: ${JWT_SECRET:dev-secret-key-min-256-bits-for-hs256-please-change-in-production}
  access-ttl: 900
  # Refresh token: 30 dni (wymóg mobilki / „zaufane urządzenie” na demo)
  refresh-ttl: 2592000

app:
  firebase:
    # Opcjonalnie: wklej JSON service account z Firebase (Render: Secret / env).
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  cors:
    # Dev whitelist: dopisz kolejne originy używane przez Web/Mobile/Desktop.
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5000
      - http://127.0.0.1:5000
      - http://localhost:8081
      - http://127.0.0.1:8081
      - http://10.0.2.2:3000
      - http://10.0.2.2:5000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - Origin
      - X-Requested-With
      - X-Client-Id
    exposed-headers:
      - Authorization
      - Location
    allow-credentials: true
    max-age-seconds: 3600

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    operationsSorter: method

# Serwer (base path API możesz dodać w WebMvcConfig lub w kontrolerach)
server:
  port: 8080
