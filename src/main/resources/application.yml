spring:
  application:
    name: alcohol-factory-api

  datasource:
    url: jdbc:postgresql://localhost:5432/alcohol_db
    username: app
    password: secret
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  docker:
    compose:
      skip-in-tests: true

logging:
  level:
    root: INFO
    com.alcoholfactory: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO

# JWT (dev – w produkcji użyj zmiennych środowiskowych)
jwt:
  secret: ${JWT_SECRET:dev-secret-key-min-256-bits-for-hs256-please-change-in-production}
  access-ttl: 900
  refresh-ttl: 604800

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    operationsSorter: method

# Serwer (base path API możesz dodać w WebMvcConfig lub w kontrolerach)
server:
  port: 8080
