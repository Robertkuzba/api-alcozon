name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Spotless (Google Java Format)
        run: ./mvnw -B spotless:check
      - name: Checkstyle (code style rules)
        run: ./mvnw -B checkstyle:check

  build:
    name: Tests and package
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Verify (tests + build; style already checked)
        env:
          SPRING_PROFILES_ACTIVE: test
          TESTCONTAINERS_CHECKS_DISABLE: true
        run: ./mvnw -B verify "-Dcheckstyle.skip=true" "-Dspotless.check.skip=true"
