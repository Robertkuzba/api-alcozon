services:
  postgres:
    image: postgres:15-alpine
    container_name: alcohol-db
    environment:
      POSTGRES_DB: alcohol_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d alcohol_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
